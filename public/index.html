<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HR Core — نظام إدارة الموارد البشرية</title>
    <meta name="description" content="لوحة تحكم الموارد البشرية: إدارة الموظفين والحضور والرواتب." />
    <meta name="theme-color" content="#534feb" />

    <!-- Self-hosted: no CDN, so the app renders identically offline or on a
         locked-down network. Regenerate with `npm run vendor`. -->
    <link rel="preload" href="/vendor/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2"
          as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/vendor/fonts.css" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23534feb'/><text y='68' x='50' text-anchor='middle' font-size='52' fill='white' font-family='sans-serif'>H</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <!-- Lucide provides the real icon vectors. The Figma exports sit behind
         signed URLs that expire in ~7 days and can't be committed, so a genuine
         icon library is used rather than hand-drawn paths. -->
    <script src="/vendor/lucide.min.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
